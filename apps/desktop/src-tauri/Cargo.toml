[package]
name = "deepseek-harness-desktop"
version = "0.30.0-alpha.4"
description = "Desktop application for DeepSeek Harness (dsh)"
authors = [ "deepseek-harness-desktop contributors" ]
edition = "2024"

[lib]
name = "main"
crate-type = [
  "staticlib",
  "cdylib",
  "rlib"
]

[build-dependencies]
tauri-build = { version = "2", features = [] }
tauri-utils = "2"
serde_json = "1"
json-patch = "3"
tauri-runtime-electron = { version = "0.1.0", path = "../../../crates/tauri-runtime-electron" }

[dependencies]
tauri = { version = "2", default-features = false, features = [
  "tray-icon",
  "image-png",
  "devtools",
  "protocol-asset",
  "unstable",
  "dynamic-acl"
] }
tauri-runtime-electron = { version = "0.1.0", path = "../../../crates/tauri-runtime-electron", features = [
  "tauri",
  "devtools"
] }
electron-rs = { git = "https://github.com/hairyf/electron-rs.git", rev = "122132226cf2be31b6fc29eae56cd0b5d63bc44a" }
tauri-plugin-single-instance = { version = "2", features = [ "deep-link" ] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-notifications = { version = "0.5.0-rc.14", default-features = false }
tauri-plugin-autostart = "2"
tauri-plugin-http = { version = "2.6", default-features = false, features = [
  "rustls-tls",
  "http2",
  "charset",
  "system-proxy"
] }
tauri-plugin-os = "2.3"
image = { version = "0.25", default-features = false, features = [ "png" ] }
arboard = { version = "3", features = [ "wayland-data-control" ] }
base64 = "0.22"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
sha2 = "0.10"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "fmt",
  "time"
] }
tracing-appender = "0.2"
tracing-log = "0.2"
time = { version = "0.3", features = [ "formatting" ] }
reqwest = { version = "0.12", features = [
  "json",
  "stream",
  "socks"
] }
zip = "0.6"
futures-util = "0.3"
flate2 = "1"
tar = "0.4"
rayon = "1.10"
zstd = { version = "0.13", features = [ "zstdmt" ] }
async-trait = "0.1"
tokio = { version = "1", features = [ "full" ] }
semver = "1"
dunce = "1.0.5"
sysinfo = { version = "0.39.6", default-features = false, features = [ "system" ] }
tempfile = "3"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
rdev = "0.5.3"

[dev-dependencies]
auto-launch = "0.5"
tauri = { version = "2", default-features = false, features = [ "test" ] }
tempfile = "3"

[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
rfd = { version = "0.16", default-features = false, features = [
  "common-controls-v6",
  "xdg-portal",
  "wayland",
  "tokio",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
  "NSWindow",
  "NSView",
  "NSButton",
] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
  "std",
  "NSObject",
  "NSProcessInfo",
  "NSGeometry",
] }
core-graphics = "0.25"
core-foundation = "0.10"

[target.'cfg(unix)'.dependencies]
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs", rev = "c4c45d503ea115a839aae718d02f79e7c7f0f673" }
libc = "0.2"

[patch.crates-io]
tauri-plugin-notifications = { path = "../../../crates/tauri-plugin-notifications" }
tauri-runtime = { path = "vendor/tauri-runtime" }

[patch."https://github.com/hairyf/electron-rs.git"]
electron-rs = { path = "../../../crates/electron-rs" }

[profile.dev]
debug = 1

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Environment",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Ioctl",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_SystemServices",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
