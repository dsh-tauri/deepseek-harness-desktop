- id: schedule
  disabled: &desktop-scheduler-enabled !!js |
    (() => {
      const entry = ctx[Symbol.for('cordis.entry')]
      const scheduler = entry.parent.tree.root.data.find(item => item.id === 'dsh-tauri-scheduler')
      const disabled = scheduler?.disabled
      return !!scheduler && !(disabled && typeof disabled === 'object' && '__jsExpr' in disabled ? entry.evaluate(disabled.__jsExpr) : disabled)
    })()
- id: ui-schedule
  disabled: *desktop-scheduler-enabled
- insert:
    - id: dsh-tauri-scheduler
      name: dsh-tauri-scheduler
      disabled: !!js |
        (() => {
          const version = process.env.DSH_TAURI_CORE_VERSION
          if (!version) return false
          const [core, pre = ''] = version.split('-')
          const [major, minor, patch] = core.split('.').map(Number)
          if (major !== 0) return major > 0
          if (minor !== 2) return minor > 2
          if (patch !== 2) return patch > 2
          return pre === '' || pre.localeCompare('rc.1', undefined, { numeric: true }) >= 0
        })()
    - id: dsh-taiwind
      name: dsh-taiwind
