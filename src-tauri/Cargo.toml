[package]
name = "deepseek-harness-desktop"
version = "0.15.5"
description = "Desktop application for DeepSeek Harness (dsh)"
authors = [ "deepseek-harness-desktop contributors" ]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "main"
crate-type = [
  "staticlib",
  "cdylib",
  "rlib"
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
  "tray-icon",
  "image-png",
  "devtools",
  "macos-private-api"
] }
# E2E：应用内嵌 WebDriver server（Tauri 官方推荐的 WebdriverIO 驱动方式）。
# 仅当进程环境带 TAURI_WEBDRIVER_PORT 时监听，正常运行不开放端口。
tauri-plugin-wdio-webdriver = "1"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
# 桌宠素材直连远端：插件版 HTTP 从 Rust 发起请求，绕开 githubusercontent 的 CORS。
# 版本须与 package.json 的 @tauri-apps/plugin-http（catalog:tauri，^2.6.0）保持同一 minor：
# tauri CLI 会在构建前校验 NPM 包与 Rust crate 的 major/minor 是否一致，不一致直接退出。
tauri-plugin-http = "2.6"
# 前端读取系统版本（`@tauri-apps/plugin-os` 的 `type()` / `version()`）用于缩放的平台判定。
# 版本须与 package.json 的 @tauri-apps/plugin-os（catalog:tauri，^2.3.2）保持同一 minor：
# tauri CLI 会在构建前校验 NPM 包与 Rust crate 的 major/minor 是否一致，不一致直接退出。
tauri-plugin-os = "2.3"
image = { version = "0.25", default-features = false, features = [ "png" ] }
arboard = { version = "3", features = [ "wayland-data-control" ] }
base64 = "0.22"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
sha2 = "0.10"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "fmt",
  "time"
] }
tracing-appender = "0.2"
tracing-log = "0.2"
time = { version = "0.3", features = [ "formatting" ] }
reqwest = { version = "0.12", features = [
  "json",
  "stream"
] }
rdev = "0.5.3"
zip = "0.6"
futures-util = "0.3"
flate2 = "1"
tar = "0.4"
rayon = "1.10"
zstd = { version = "0.13", features = [ "zstdmt" ] }
async-trait = "0.1"
tokio = { version = "1", features = [ "full" ] }
semver = "1"
dunce = "1.0.5"

[dev-dependencies]
auto-launch = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
  "std",
  "NSObject",
  "NSProcessInfo",
] }
# CGEventTap 直监听：绕开 rdev 0.5.3 在 macOS 上对 KeyPress 事件无条件调
# TSMGetInputSourceProperty（必须 main queue）导致的 dispatch_assert_queue SIGTRAP。
# 见 issue #397。core-graphics / core-foundation 在 rdev 传递依赖里已有，
# 不引入新的下载源。
# core-foundation 与 core-graphics 0.25 对齐到 0.10：监听线程要自己持有 CGEventTap
# 并在系统禁用事件 tap 后重新启用（issue #559），这需要在同一版 core-foundation 上
# 建 run loop source 并 add_source，混用 0.9 / 0.10 会类型不匹配。
core-graphics = "0.25"
core-foundation = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Linux 托盘直接使用上游 tray-icon 0.25 的 KSNI 后端（实现见 src/desktop/linux_tray.rs，
# 背景见 issue #386 / #438）：
# - tauri 2.11.5 仍固定 `tray-icon = "^0.24"`，而 0.24 在 Linux 上只有 libappindicator/GTK
#   后端，该后端不上报任何托盘事件，单击/双击都无法唤起主窗口；
# - tray-icon 0.25.0 新增的 KSNI 后端会把 SNI 的 Activate 转成
#   `TrayIconEvent::Click { button: Left }`；
# - 但 tauri 2.x 的菜单类型来自 muda 0.19，与 tray-icon 0.25 的 muda 0.20 不是同一套类型
#   （`TrayIconBuilder::menu` 的 `ContextMenu` trait 不同），既无法 `cargo update` 也无法
#   `[patch.crates-io]` 把 tauri 的 tray-icon 顶到 0.25，tauri 3 目前只有 alpha。
# 因此 Linux 上绕过 `tauri::tray` 自建托盘；tauri 2.x 跟进 bump 后可删除本依赖与
# src/desktop/linux_tray.rs。`ksni` 特性同时避免再引入 GTK/libappindicator 后端。
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.25", default-features = false, features = [ "ksni" ] }

[target.'cfg(windows)'.dependencies]
rfd = "0.16"
webview2-com = "0.38"
windows-core = "0.61"
winreg = "0.55"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Environment",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_UI_WindowsAndMessaging",
] }
