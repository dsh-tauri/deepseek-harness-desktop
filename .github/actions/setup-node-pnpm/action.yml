name: Setup Node.js and pnpm
description: Install the repository pnpm version and configure Node.js caching

inputs:
  node-version:
    description: Node.js version passed to actions/setup-node
    required: false
    default: '22'
  cache-dependency-path:
    description: Dependency lockfile used for the pnpm cache key
    required: false
    default: pnpm-lock.yaml

  standalone:
    description: Install pnpm as a standalone executable (pnpm.exe on Windows)
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # package.json 的 packageManager 字段提供精确 pnpm 版本。
    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        standalone: ${{ inputs.standalone }}

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
