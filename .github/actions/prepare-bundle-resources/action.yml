name: Prepare offline bundle resources
description: >-
  Download and unpack the Electron asar dsh core and pnpm into
  apps/desktop/src-tauri/resources, then rewrite manifest.jsonc so every bundled dependency
  resolves through `$Resources/...`. The resulting `tauri build` produces an
  installer that needs no download on first launch.

inputs:
  platform:
    description: Target platform (windows | macos | linux)
    required: true
  arch:
    description: Target architecture (x64 | arm64)
    required: true
  dsh-tag:
    description: deepseek-harness-pkg release tag bundled as the built-in core
    required: true
  bundle-git:
    description: >-
      Also bundle MinGit. Off by default: starting dsh needs no Git, only
      git-backed features (worktree, `github:` plugins) do, and an offline
      machine can never provision it afterwards.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Download and unpack bundled runtimes
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        ARCH: ${{ inputs.arch }}
        DSH_TAG: ${{ inputs.dsh-tag }}
        BUNDLE_GIT: ${{ inputs.bundle-git }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        with_git=false
        if [ "$PLATFORM" = "windows" ] && [ "$BUNDLE_GIT" = "true" ]; then
          with_git=true
        fi
        git_flag=""
        [ "$with_git" = "true" ] && git_flag="--with-git"

        workdir="$(mktemp -d)"
        trap 'rm -rf "$workdir"' EXIT

        sha256_of() {
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$1" | awk '{print $1}'
          else
            shasum -a 256 "$1" | awk '{print $1}'
          fi
        }

        fetch() {
          local url="$1" out="$2" attempt
          for attempt in 1 2 3 4; do
            if curl -fL --retry 3 --retry-delay 3 --connect-timeout 30 --max-time 7200 -o "$out" "$url"; then
              return 0
            fi
            echo "download failed (attempt ${attempt}/4): ${url}"
            sleep 10
          done
          echo "::error::failed to download ${url}"
          return 1
        }

        verify() {
          local file="$1" expected="$2" label="$3" actual
          if [ -z "$expected" ]; then
            echo "::error::no trusted SHA-256 available for ${label}"
            return 1
          fi
          actual="$(sha256_of "$file")"
          if [ "$actual" != "$expected" ]; then
            echo "::error::${label} SHA-256 mismatch: expected ${expected}, got ${actual}"
            return 1
          fi
          echo "${label} SHA-256 verified"
        }

        extract() {
          local archive="$1" dest="$2"
          mkdir -p "$dest"
          case "$archive" in
            *.zip)
              if command -v unzip >/dev/null 2>&1; then
                (cd "$dest" && unzip -q "$archive")
              else
                (cd "$dest" && tar -xf "$archive")
              fi
              ;;
            *)
              (cd "$dest" && tar -xzf "$archive")
              ;;
          esac
        }

        flatten() {
          local dir="$1" entries=()
          while IFS= read -r entry; do entries+=("$entry"); done < <(find "$dir" -mindepth 1 -maxdepth 1)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            shopt -s dotglob
            mv "${entries[0]}"/* "$dir"/
            shopt -u dotglob
            rmdir "${entries[0]}"
          fi
        }

        install_tree() {
          local from="$1" to="$2"
          rm -rf "$to"
          mkdir -p "$to"
          cp -a "$from/." "$to/"
        }

        assets="$(node scripts/bundle-metadata.mjs --assets --platform "$PLATFORM" --arch "$ARCH" $git_flag)"
        while IFS='|' read -r key name url sha; do
          [ -n "${key:-}" ] || continue
          case "$key" in
            dsh) dsh_name="$name"; dsh_url="$url" ;;
            pnpm) pnpm_name="$name"; pnpm_url="$url"; pnpm_sha="$sha" ;;
            git) git_name="$name"; git_url="$url"; git_sha="$sha" ;;
          esac
        done <<< "$assets"
        fetch "$dsh_url" "${workdir}/${dsh_name}"
        dsh_digest="$(gh api "repos/dsh-tauri-desk/deepseek-harness-pkg/releases/tags/${DSH_TAG}" \
          --jq ".assets[] | select(.name == \"${dsh_name}\") | .digest" 2>/dev/null \
          | sed 's/^sha256://' | head -n 1)"
        verify "${workdir}/${dsh_name}" "$dsh_digest" "dsh core ${dsh_name}"
        extract "${workdir}/${dsh_name}" "${workdir}/dsh"
        flatten "${workdir}/dsh"
        install_tree "${workdir}/dsh" "apps/desktop/src-tauri/resources/dsh"
        fetch "$pnpm_url" "${workdir}/${pnpm_name}"
        verify "${workdir}/${pnpm_name}" "$pnpm_sha" "pnpm ${pnpm_name}"
        extract "${workdir}/${pnpm_name}" "${workdir}/pnpm"
        flatten "${workdir}/pnpm"
        install_tree "${workdir}/pnpm" "apps/desktop/src-tauri/resources/pnpm"
        if [ -n "${git_name:-}" ]; then
          fetch "$git_url" "${workdir}/${git_name}"
          verify "${workdir}/${git_name}" "$git_sha" "MinGit ${git_name}"
          extract "${workdir}/${git_name}" "${workdir}/git"
          flatten "${workdir}/git"
          install_tree "${workdir}/git" "apps/desktop/src-tauri/resources/git"
        fi

        node scripts/bundle-metadata.mjs --manifest --platform "$PLATFORM" --arch "$ARCH" $git_flag

    - name: Verify bundled entries
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        ARCH: ${{ inputs.arch }}
      run: |
        set -euo pipefail
        dsh_archive="$(node scripts/bundle-metadata.mjs --archive-name --platform "$PLATFORM" --arch "$ARCH")"
        entries="pnpm/bin/pnpm.cjs dsh/${dsh_archive}"
        if grep -q '"managedRoot": "$Resources/git"' apps/desktop/src-tauri/resources/manifest.jsonc; then
          entries="$entries git/cmd/git.exe"
        fi
        missing=0
        for entry in $entries; do
          if [ ! -e "apps/desktop/src-tauri/resources/${entry}" ]; then
            echo "::error::bundled entry is missing: apps/desktop/src-tauri/resources/${entry}"
            missing=1
          fi
        done
        [ "$missing" -eq 0 ] || exit 1

        grep -q '"$Resources/' apps/desktop/src-tauri/resources/manifest.jsonc
        echo "--- bundled resources ---"
        du -sh apps/desktop/src-tauri/resources/dsh apps/desktop/src-tauri/resources/pnpm 2>/dev/null || true
        [ -d apps/desktop/src-tauri/resources/git ] && du -sh apps/desktop/src-tauri/resources/git || true
        sed -n '/"dependencies"/,/^  }/p' apps/desktop/src-tauri/resources/manifest.jsonc
