name: Reusable Linux Offline Bundle Build

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      dsh_tag:
        required: true
        type: string
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build offline bundle (linux)
    # 22.04 的 glibc/WebKitGTK 产物兼容 Ubuntu 22.04 及更新版本。
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          toolchain: 1.98.1

      - name: Install system dependencies
        shell: bash
        run: |
          apt_ok=0
          for i in {1..3}; do
            if timeout 180 sudo apt-get update \
              -o Acquire::Retries=5 \
              -o Acquire::http::Timeout=60 \
              -o Acquire::https::Timeout=60 \
              -o Acquire::ftp::Timeout=60; then
              apt_ok=1
              break
            fi
            echo "apt-get update 失败，准备重试 ($i/3)..."
            sleep 10
          done
          [ "$apt_ok" = "1" ] || { echo "apt-get update 连续 3 次失败，中止"; exit 1; }
          sudo apt-get install -y libappindicator3-dev librsvg2-dev patchelf unzip

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare bundled resources
        uses: ./.github/actions/prepare-bundle-resources
        with:
          platform: linux
          arch: x64
          dsh-tag: ${{ inputs.dsh_tag }}

      # 只出 deb：AppImage 由 linuxdeploy 打包，而离线包往 AppDir 里塞了 300 MiB /
      # 一万余文件，linuxdeploy 在这种规模的 AppDir 上直接失败（普通安装包没有这份
      # 资源所以不受影响）。内网离线部署本来也以 deb 为主；AppImage 留作后续单独排查。
      #
      # 已知限制：deb 把资源装到 /usr/lib/<product>/（root 所有），随包 dsh 内核因此
      # 只读。桌面端每次启动会往内核目录写插件入口链接与 JS 补丁（见
      # `service::core::runtime::link_required_plugins`），非 root 用户运行时会失败。
      # 需要 root 安装后补齐目录权限，或改用 Windows/macOS 产物。
      - name: Build offline packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles deb

      - name: Upload build outputs
        uses: actions/upload-artifact@v6
        with:
          name: release-bundle-linux
          path: apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 7
