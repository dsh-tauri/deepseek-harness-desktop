name: Build Android Test

# 仅手动触发：用于验证 native 工程能否真的编译出 debug APK。
# 只出 debug APK（Android Gradle Plugin 自带 debug keystore），不依赖任何签名
# secret；正式签名的产物见 build-android.yml，随桌面端 release 发布的资产见
# release-native.yml。
#
# 原生兼容性以 prebuild + gradle 编译为准：本仓库根 package.json 的 react / react-dom /
# typescript 由共享 catalog 固定，与 expo 57 期望版本不一致，`expo install --check`
# 在这里必然以 1 退出，所以不把它当门禁。
on:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支的手动构建排队执行，避免并发挤占 runner。
concurrency:
  group: build-android-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Verify Native Project (debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read native version
        id: meta
        run: |
          set -euo pipefail
          version="$(node --input-type=commonjs -p "require('./app.json').expo.version")"
          pkg="$(node --input-type=commonjs -p "require('./package.json').version")"
          if [ "$version" != "$pkg" ]; then
            echo "::error::app.json expo.version ($version) != package.json version ($pkg); 请让 native 版本跟随桌面端版本"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "native version: $version"

      - name: Typecheck native sources
        run: pnpm run typecheck:native

      - name: Test native sources
        run: pnpm run test:native

      # 只验证 JS bundle 能为 android 打包，不产出发布资产。
      - name: Export Android JavaScript bundle
        env:
          CI: '1'
        run: pnpm run build:native

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'

      - name: Install Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'

      - name: Generate Android project
        env:
          CI: '1'
        run: pnpm run prebuild:native

      - name: Build debug APK
        env:
          CI: '1'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a,x86_64

      # debug 构建的 native 库不做 16 KB 页对齐打包，这里只做基础对齐与签名校验；
      # 16 KB 对齐（zipalign -P 16）在 build-android.yml / release-native.yml 的发布产物上强制。
      - name: Verify debug APK
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/36.0.0"
          source='android/app/build/outputs/apk/debug/app-debug.apk'
          mkdir -p release
          destination="release/Deepseek.Harness.Android_${VERSION}_debug.apk"
          cp "$source" "$destination"
          "$tools/zipalign" -c 4 "$destination"
          "$tools/apksigner" verify --verbose --print-certs "$destination"
          # 先落文件再读取：`aapt dump badging | head` 会让 aapt 收到 SIGPIPE，pipefail 下误报失败。
          "$tools/aapt" dump badging "$destination" > "$RUNNER_TEMP/badging.txt"
          head -n 5 "$RUNNER_TEMP/badging.txt"
          (cd release && sha256sum ./*.apk > SHA256SUMS.txt)
          find release -type f -print | sort

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: android-apk-debug
          path: release/
          if-no-files-found: error
          retention-days: 7
