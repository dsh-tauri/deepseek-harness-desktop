name: Build Test (unsigned)

on:
  # 仅手动触发：用于快速验证「能否在当前平台产物上完成一次完整 tauri build」，
  # 不发布、不打签名（TPM 签名密钥 / Apple 证书 / 公证强制可省），不写 GitHub Release。
  # 触发后可在此 run 的 Actions 页面核对三平台的打包产物是否生成。
  workflow_dispatch:
    inputs:
      platform:
        description: 只想验证的平台（默认全部）
        required: false
        default: all
        type: choice
        options:
          - all
          - macos
          - linux
          - windows
      nightly:
        description: 验证独立夜间构建身份及资产名称
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# 同一分支的手动构建排队执行，避免并发挤占 runner。
concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 与 release 的可复用构建（build-macos.yml）保持一致：架构与 runner 必须同构，
  # 否则 `pnpm install` 会漏装另一架构的原生可选依赖（issue #1326）。
  macos:
    name: Build (macos-${{ matrix.id }})
    if: ${{ inputs.platform == 'all' || inputs.platform == 'macos' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: aarch64
            target: aarch64-apple-darwin
            runner: macos-26
          - id: x86_64
            target: x86_64-apple-darwin
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Xcode
        uses: ./.github/actions/setup-xcode

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Stamp nightly version
        if: inputs.nightly
        shell: bash
        run: node scripts/stamp-version.mjs 0.0.0-nightly.test

      - name: Route hdiutil through the flake buffer
        shell: bash
        # runner 上 hdiutil 会随机报 Resource busy / DiskArbitration 超时
        # (actions/runner-images#7522)，把带重试的同名包装排到 PATH 前面。
        run: |
          chmod +x scripts/hdiutil-retry/hdiutil
          echo "$PWD/scripts/hdiutil-retry" >> "$GITHUB_PATH"

      # 不注入任何签名/公证 secrets，产出未签名（unsigned/no-notarized）bundle，
      # 依然完整走一遍 beforeBuildCommand（build:plugins + 前端）+ cargo release 构建。
      - name: Build package
        run: pnpm tauri build --target ${{ matrix.target }} ${{ inputs.nightly && '--config src-tauri/tauri.nightly.conf.json' || '' }} --config src-tauri/tauri.macos-bundle.conf.json

      - name: Normalize release asset names
        run: node scripts/rename-release-assets.mjs apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg

      - name: Upload build outputs
        uses: actions/upload-artifact@v6
        with:
          name: build-test-macos-${{ matrix.id }}
          path: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Build (linux-${{ matrix.arch }})
    if: ${{ inputs.platform == 'all' || inputs.platform == 'linux' }}
    # 与 release 的可复用构建一致：两个架构都用 Ubuntu 22.04（GLIBC 2.35，issue #1124）。
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libappindicator3-dev librsvg2-dev patchelf squashfs-tools gstreamer1.0-plugins-good gstreamer1.0-plugins-bad

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Stamp nightly version
        if: inputs.nightly
        shell: bash
        run: node scripts/stamp-version.mjs 0.0.0-nightly.test

      - name: Build packages
        run: pnpm tauri build --bundles appimage,deb ${{ inputs.nightly && '--config src-tauri/tauri.nightly.conf.json' || '' }}

      - name: Fix AppImage host libraries and GTK backend
        shell: bash
        run: |
          python3 -B scripts/test_fix_appimage_host_libs.py
          mapfile -d '' appimages < <(find apps/desktop/src-tauri/target/release/bundle/appimage -name '*.AppImage' -print0)
          [ "${#appimages[@]}" -gt 0 ] || { echo '::error::no AppImage was produced'; exit 1; }
          for appimage in "${appimages[@]}"; do
            bash scripts/fix-appimage-host-libs.sh --require-removal "$appimage"
          done

      - name: Normalize release asset names
        run: node scripts/rename-release-assets.mjs apps/desktop/src-tauri/target/release/bundle/appimage apps/desktop/src-tauri/target/release/bundle/deb

      - name: Verify arm64 glibc ABI
        if: matrix.arch == 'arm64'
        shell: bash
        run: |
          mapfile -d '' artifacts < <(find apps/desktop/src-tauri/target/release/bundle/appimage apps/desktop/src-tauri/target/release/bundle/deb -type f \( -name '*.AppImage' -o -name '*.deb' \) -print0)
          [ "${#artifacts[@]}" -gt 0 ] || { echo '::error::no Linux arm64 artifacts were produced'; exit 1; }
          bash scripts/check-linux-glibc-abi.sh --max 2.35 "${artifacts[@]}"

      - name: Upload build outputs
        uses: actions/upload-artifact@v6
        with:
          name: build-test-linux-${{ matrix.arch }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Build (windows)
    if: ${{ inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Stamp nightly version
        if: inputs.nightly
        shell: bash
        run: node scripts/stamp-version.mjs 0.0.0-nightly.test

      # WiX 只接受纯数字版本；NSIS 仍使用完整 SemVer。
      - name: Prepare MSI version override
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const rawVer = require('./apps/desktop/src-tauri/tauri.conf.json').version;
            const cleanVer = rawVer.replace(/[-+].*\$/, '');
            fs.writeFileSync('apps/desktop/release-msi-version.tmp.json', JSON.stringify({ bundle: { windows: { wix: { version: cleanVer } } } }));
            console.log('MSI version override ->', cleanVer);
          "

      - name: Build packages
        run: pnpm tauri build ${{ inputs.nightly && '--config src-tauri/tauri.nightly.conf.json' || '' }} --config release-msi-version.tmp.json

      - name: Normalize release asset names
        run: node scripts/rename-release-assets.mjs apps/desktop/src-tauri/target/release/bundle/nsis apps/desktop/src-tauri/target/release/bundle/msi

      - name: Upload build outputs
        uses: actions/upload-artifact@v6
        with:
          name: build-test-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7
