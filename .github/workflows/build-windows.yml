name: Reusable Windows Build

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      version:
        description: 注入的版本号；为空时沿用仓库内版本，仅夜间构建使用
        required: false
        type: string
        default: ''
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.id }})
    # 原生 arm64（issue #1402）各用同架构 runner：`pnpm install` 只落宿主平台的原生
    # 可选依赖，在 x64 上交叉打 arm64 会漏掉 `@tailwindcss/oxide-win32-arm64-msvc`
    # 一类绑定，产物一启动即 `Cannot find native binding`（与 macOS 的 issue #1326 同类）。
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            arch: x64
            target: x86_64-pc-windows-msvc
            runner: windows-latest
          - id: windows-arm64
            arch: arm64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Windows runner 默认 PowerShell，$STAMP_VERSION 会被当成本地变量读成空串；显式用 bash。
      - name: Stamp injected version
        if: inputs.version != ''
        shell: bash
        env:
          STAMP_VERSION: ${{ inputs.version }}
        run: node scripts/stamp-version.mjs "$STAMP_VERSION"

      # WiX 只接受纯数字版本；NSIS 仍使用完整 SemVer。
      - name: Prepare MSI version override
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const rawVer = require('./apps/desktop/src-tauri/tauri.conf.json').version;
            const cleanVer = rawVer.replace(/[-+].*$/, '');
            fs.writeFileSync('apps/desktop/release-msi-version.tmp.json', JSON.stringify({ bundle: { windows: { wix: { version: cleanVer } } } }));
            console.log('MSI version override ->', cleanVer);
          "

      - name: Build packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build ${{ inputs.version != '' && '--config src-tauri/tauri.nightly.conf.json' || '' }} --target ${{ matrix.target }} --config release-msi-version.tmp.json

      # 安装包里的 Electron 运行时由 bundler 从这里取；缺了它 arm64 安装包会装上却启动不了。
      - name: Verify arm64 Electron runtime
        if: matrix.arch == 'arm64'
        shell: bash
        run: |
          runtime="apps/desktop/src-tauri/target/${{ matrix.target }}/release/runtime/win32-arm64"
          if [ ! -f "$runtime/electron.exe" ]; then
            echo "::error::$runtime/electron.exe is missing; the arm64 installer would carry no usable runtime"
            exit 1
          fi
          shopt -s nullglob
          dlls=("$runtime"/*.dll)
          if [ "${#dlls[@]}" -eq 0 ]; then
            echo "::error::$runtime has no Electron DLLs"
            exit 1
          fi

      - name: Normalize release asset names
        run: node scripts/rename-release-assets.mjs apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi

      - name: Upload build outputs
        uses: actions/upload-artifact@v6
        with:
          name: release-windows-${{ matrix.arch }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7
