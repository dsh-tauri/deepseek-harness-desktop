name: Reusable macOS Offline Bundle Build

on:
  workflow_call:
    inputs:
      platform_filter:
        required: false
        type: string
        default: all
      source_ref:
        required: true
        type: string
      dsh_tag:
        required: true
        type: string
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      APPLE_CERTIFICATE:
        required: true
      APPLE_CERTIFICATE_PASSWORD:
        required: true
      APPLE_ID:
        required: true
      APPLE_PASSWORD:
        required: true
      APPLE_TEAM_ID:
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build offline bundle (${{ matrix.id }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-aarch64
            target: aarch64-apple-darwin
            arch: arm64
          - id: macos-x86_64
            target: x86_64-apple-darwin
            arch: x64
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - name: Filter target architecture
        id: check
        shell: bash
        env:
          PLATFORM_FILTER: ${{ inputs.platform_filter }}
          PLATFORM_ID: ${{ matrix.id }}
        run: |
          should_run=true
          if [ "$PLATFORM_FILTER" != "all" ] && [ "$PLATFORM_FILTER" != "$PLATFORM_ID" ]; then
            should_run=false
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.check.outputs.should_run == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Setup Node.js and pnpm
        if: steps.check.outputs.should_run == 'true'
        uses: ./.github/actions/setup-node-pnpm

      - name: Install Rust stable
        if: steps.check.outputs.should_run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        if: steps.check.outputs.should_run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Prepare bundled resources
        if: steps.check.outputs.should_run == 'true'
        uses: ./.github/actions/prepare-bundle-resources
        with:
          platform: macos
          arch: ${{ matrix.arch }}
          dsh-tag: ${{ inputs.dsh_tag }}

      - name: Validate signing secrets
        if: steps.check.outputs.should_run == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -z "${!name}" ] && missing+=("$name")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing macOS signing secrets: ${missing[*]}"
            exit 1
          fi

      # 离线包只把 Node 运行时 / 内核 / pnpm 的**压缩包**随包分发（首次启动解压到
      # AppData），但 Apple 的公证会展开 .app 内的压缩包逐个校验 Mach-O（zip 与 tgz
      # 都会被展开），未签名的随包原生模块（sharp / koffi / reflink 的 `.node`）会让公证
      # 以 "Archive contains critical validation errors" 失败。因此必须在 tauri 打包前
      # 把压缩包里的原生模块补签好：解压 → 签约 → 同名原样重打包。
      # 直接裸放在 resources/ 下的 Mach-O（安全网，例如内置插件带原生模块）同样补签。
      - name: Sign bundled Mach-O binaries
        if: steps.check.outputs.should_run == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          keychain="$RUNNER_TEMP/bundle-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/bundle-cert.p12"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/bundle-cert.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          if [ -z "$identity" ]; then
            echo "::error::no Developer ID Application identity found in the imported certificate"
            exit 1
          fi

          # 只挑可能是 Mach-O 的候选（可执行位或已知扩展名）再用 file 确认，避免对上万个
          # 文件逐个调用 file。
          #
          # 已经是 Developer ID 签名的（nodejs.org 的 node 二进制自带签名与 JIT 相关
          # entitlement）原样保留：重签会丢掉 entitlement，节点进程在 hardened runtime
          # 下会因 JIT 被拒直接崩。其余 ad-hoc / 未签名的才补签，并在存在 entitlement 时
          # 一并保留。
          #
          # `signed` / `kept` 由 sign_tree 直接累加（bash 动态作用域，有意为之）；
          # 补签文件按相对路径追加到 $2，用于重打包后逐个复验签名存活。
          signed=0
          kept=0
          sign_tree() {
            local root="$1" list="$2" file authority preserve rel
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              case "$(file -b "$file")" in
                *Mach-O*) ;;
                *) continue ;;
              esac
              authority="$(codesign -dv --verbose=2 "$file" 2>&1 | awk -F= '/^Authority=/{print $2; exit}' || true)"
              if [ "${authority#Developer ID Application}" != "$authority" ]; then
                kept=$((kept + 1))
                continue
              fi
              preserve=""
              if codesign -d --entitlements - "$file" 2>/dev/null | grep -q '<key>'; then
                preserve="--preserve-metadata=entitlements"
              fi
              codesign --force --options runtime --timestamp $preserve \
                --keychain "$keychain" --sign "$identity" "$file"
              signed=$((signed + 1))
              rel="${file#"$root"/}"
              printf '%s\n' "$rel" >> "$list"
            done < <(find "$root" -type f \
              \( -name '*.node' -o -name '*.dylib' -o -name '*.so' -o -perm -100 \) -print)
          }

          sign_tree src-tauri/resources "$RUNNER_TEMP/signed-direct.txt"

          for archive in src-tauri/resources/*.zip src-tauri/resources/*.tgz src-tauri/resources/*.tar.gz; do
            name="$(basename "$archive")"
            before="$RUNNER_TEMP/unpack-before-$name"
            after="$RUNNER_TEMP/unpack-after-$name"
            list="$RUNNER_TEMP/signed-$name.txt"
            rm -rf "$before" "$after" "$list"
            mkdir -p "$before" "$after"
            bsdtar -xf "$archive" -C "$before"
            sign_tree "$before" "$list"
            rm -f "$archive"
            case "$name" in
              *.tar.gz | *.tgz) (cd "$before" && bsdtar -czf "$archive" $(ls -A)) ;;
              *) (cd "$before" && bsdtar -a -cf "$archive" $(ls -A)) ;;
            esac
            bsdtar -xf "$archive" -C "$after"
            # 重打包不得改变解压布局（应用按顶层目录解压 + flatten）
            if ! diff <(cd "$before" && find . | sort) <(cd "$after" && find . | sort) >/dev/null; then
              echo "::error::repacking $name changed the unpacked layout"
              exit 1
            fi
            # 签名必须挺过打包往返
            while IFS= read -r rel; do
              [ -n "$rel" ] || continue
              codesign --verify --strict "$after/$rel"
            done < "$list"
            echo "repacked $name ($(du -h "$archive" | cut -f1))"
          done

          echo "signed $signed Mach-O binaries ($kept already Developer ID signed)"

      # 必须同时产出 app：只给 `--bundles dmg` 时 tauri 会把 .app 当中间产物，打完 dmg
      # 就删掉它（日志里的 `Cleaning .../bundle/macos/<name>.app`），后面的签名/公证
      # 校验步骤便找不到目标。普通安装包不带 --bundles、走 targets: all，两者都产出。
      - name: Build offline package
        if: steps.check.outputs.should_run == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm tauri build --target ${{ matrix.target }} --bundles app,dmg

      - name: Verify signature and notarization
        if: steps.check.outputs.should_run == 'true'
        shell: bash
        run: |
          app_path="$(find "src-tauri/target/${{ matrix.target }}/release/bundle/macos" -type d -name '*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo '::error::Built macOS app bundle was not found'
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"

      # 已知限制：.app 若被拖进 /Applications 且不属于当前用户（或来自下载的只读卷），
      # 随包 dsh 内核同样不可写，桌面端启动时的插件入口链接会失败。用户目录自持的
      # .app 不受影响。
      - name: Upload build output
        if: steps.check.outputs.should_run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: release-bundle-${{ matrix.id }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
