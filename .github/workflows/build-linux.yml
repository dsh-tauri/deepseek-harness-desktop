name: Reusable Linux Build

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      version:
        description: 注入的版本号；为空时沿用仓库内版本，仅夜间构建使用
        required: false
        type: string
        default: ''
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build (linux)
    # 22.04 的 glibc/WebKitGTK 产物兼容 Ubuntu 22.04 及更新版本。
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install system dependencies
        shell: bash
        run: |
          apt_ok=0
          for i in {1..3}; do
            if timeout 180 sudo apt-get update \
              -o Acquire::Retries=5 \
              -o Acquire::http::Timeout=60 \
              -o Acquire::https::Timeout=60 \
              -o Acquire::ftp::Timeout=60; then
              apt_ok=1
              break
            fi
            echo "apt-get update 失败，准备重试 ($i/3)..."
            sleep 10
          done
          [ "$apt_ok" = "1" ] || { echo "apt-get update 连续 3 次失败，中止"; exit 1; }
          # squashfs-tools 提供 mksquashfs，供 AppImage 宿主库剔除后重打包使用。
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf gstreamer1.0-plugins-good gstreamer1.0-plugins-bad squashfs-tools

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Stamp injected version
        if: inputs.version != ''
        env:
          STAMP_VERSION: ${{ inputs.version }}
        run: node scripts/stamp-version.mjs "$STAMP_VERSION"

      - name: Build packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles appimage,deb ${{ inputs.version != '' && '--config src-tauri/tauri.nightly.conf.json' || '' }}

      # Tauri 固定的 linuxdeploy 会把构建镜像的 libwayland-*/libxkbcommon/libxcb/
      # libXau/libXdmcp 一并打进 AppImage，AppRun 又把这些库置于 LD_LIBRARY_PATH 首位；
      # 较新发行版（Arch/CachyOS、Fedora 44…）的宿主 Mesa 因而加载到旧库，EGL 协商失败，
      # WebKit 在 eglGetDisplay 失败时直接 abort()——WebKitWebProcess SIGABRT、无窗口无日志
      # （上游 tauri#15976，本仓 #620）。.deb 用系统库，不受影响。
      # 必须在签名/上传之前完成：本步会重写 AppImage 字节。
      - name: Drop over-bundled host-interface libs from the AppImage
        shell: bash
        run: |
          mapfile -d '' appimages < <(find src-tauri/target/release/bundle/appimage -name '*.AppImage' -print0)
          [ "${#appimages[@]}" -gt 0 ] || { echo '::error::no AppImage was produced'; exit 1; }
          for appimage in "${appimages[@]}"; do
            bash scripts/fix-appimage-host-libs.sh --require-removal "$appimage"
          done

      - name: Normalize release asset names
        run: node scripts/rename-release-assets.mjs src-tauri/target/release/bundle/appimage src-tauri/target/release/bundle/deb

      - name: Upload build outputs
        uses: actions/upload-artifact@v6
        with:
          name: release-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 7
