name: Reusable Windows Offline Bundle Build

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      dsh_tag:
        required: true
        type: string
      bundle_git:
        description: 随包 MinGit（默认关闭：启动 dsh 不需要 Git）
        required: false
        type: boolean
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build offline bundle (windows)
    runs-on: windows-latest
    # 离线包要下载 Node/dsh 并压缩数百 MB 资源，远慢于普通构建。
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare bundled resources
        uses: ./.github/actions/prepare-bundle-resources
        with:
          platform: windows
          arch: x64
          dsh-tag: ${{ inputs.dsh_tag }}
          bundle-git: ${{ inputs.bundle_git }}

      # 不内置 WebView2：`offlineInstaller` 会把 212 MB 的完整离线运行时打进 exe，
      # 离线包体积因此从 ~95 MB 涨到 ~300 MB。用 Tauri 默认的 downloadBootstrapper：
      # 仅当目标机缺 WebView2 时才在安装时去微软拉约 2 MB 引导器，Win11 与已更新的
      # Win10 默认自带运行时。离线包只负责 Node/dsh/pnpm 运行时，不再背 WebView2。
      #
      # 只出 NSIS：离线包资源有数万个文件，WiX/MSI 既慢又受 2 GB cab 上限约束。
      - name: Build offline installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis

      - name: Upload build outputs
        uses: actions/upload-artifact@v6
        with:
          name: release-bundle-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
